<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP Log</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--oc-bg); color: var(--oc-fg); font-family: var(--oc-font, system-ui, sans-serif); font-size: 14px; }
  main { display: flex; flex-direction: column; gap: 12px; padding: 16px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.1em; margin: 0; }
  [hidden] { display: none !important; }
  .muted { color: var(--oc-muted); }
  p { margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Nach Super Productivity loggen</h1>
  <p id="hint" class="muted" role="status" hidden>Starte das Loggen über das Session-Menü: „Nach Super Productivity loggen“.</p>
  <div id="flow"></div>
</main>
<script src="./main.js"></script>
</body>
</html>
